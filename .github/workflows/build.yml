name: Build Malayalam Cinema APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Check Android project
        shell: bash
        run: |
          set -e
          echo "Repository:"
          ls -la
          echo
          echo "Android project:"
          find app -maxdepth 3 -type f | sort

      - name: Check database
        shell: bash
        run: |
          set -e
          if [ -f database/malayalam_cinema.db ]; then
            echo "✓ Malayalam Cinema database found"
            ls -lh database/malayalam_cinema.db
          else
            echo "ERROR: database/malayalam_cinema.db not found"
            exit 1
          fi

      - name: Build Debug APK
        shell: bash
        run: |
          set -e
          gradle assembleDebug --no-daemon --stacktrace

      - name: Find APK
        shell: bash
        run: |
          set -e
          find app/build/outputs -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Malayalam-Cinema-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error