name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find Android ZIP
        shell: bash
        run: |
          set -e

          echo "Files in repository:"
          find . -maxdepth 2 -type f -print

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Unzip Android project
        shell: bash
        run: |
          set -e

          rm -rf project
          mkdir -p project

          echo "Extracting: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d project

          echo "Project contents:"
          find project -maxdepth 4 -type f | head -100

      - name: Locate Gradle project
        shell: bash
        run: |
          set -e

          GRADLE_DIR=$(find project -name "gradlew" -type f | head -n 1)

          if [ -z "$GRADLE_DIR" ]; then
            echo "ERROR: gradlew not found."
            echo "The ZIP does not appear to contain a valid Android project."
            exit 1
          fi

          GRADLE_DIR=$(dirname "$GRADLE_DIR")

          echo "Gradle project found at: $GRADLE_DIR"
          echo "GRADLE_DIR=$GRADLE_DIR" >> "$GITHUB_ENV"

      - name: Make Gradle executable
        run: chmod +x "$GRADLE_DIR/gradlew"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build Debug APK
        working-directory: ${{ env.GRADLE_DIR }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Find APK
        shell: bash
        run: |
          set -e

          APK=$(find "$GRADLE_DIR" -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          mkdir -p output
          cp "$APK" output/Torque-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Torque-APK
          path: output/Torque-debug.apk