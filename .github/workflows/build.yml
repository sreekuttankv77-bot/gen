name: Build Malayalam Cinema APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find project ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract Android project
        shell: bash
        run: |
          set -e

          rm -rf project
          mkdir -p project

          unzip -q "$ZIP_FILE" -d project

          echo "Extracted files:"
          find project -maxdepth 5 -type f | sort | head -200

      - name: Locate Gradle project
        shell: bash
        run: |
          set -e

          GRADLEW=$(find project -type f -name "gradlew" | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew was not found after extracting the ZIP."
            echo ""
            echo "The ZIP must contain a complete Android project."
            echo ""
            echo "ZIP contents:"
            find project -maxdepth 6 -type f | sort | head -300
            exit 1
          fi

          GRADLE_DIR=$(dirname "$GRADLEW")

          echo "Gradle project found:"
          echo "$GRADLE_DIR"

          echo "GRADLE_DIR=$GRADLE_DIR" >> "$GITHUB_ENV"

      - name: Make Gradle executable
        shell: bash
        run: |
          chmod +x "$GRADLE_DIR/gradlew"

      - name: Build debug APK
        shell: bash
        working-directory: ${{ env.GRADLE_DIR }}
        run: |
          ./gradlew --no-daemon assembleDebug

      - name: Find APK
        shell: bash
        run: |
          set -e

          APK=$(find "$GRADLE_DIR" -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          cp "$APK" "$GITHUB_WORKSPACE/Malayalam-Cinema-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Malayalam-Cinema-debug
          path: Malayalam-Cinema-debug.apk