name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Extract Android Project
      run: unzip -q Gen-Android-Project.zip

    - name: Make gradlew executable
      run: chmod +x Gen/gradlew

    - name: Build Debug APK
      working-directory: Gen
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: app-debug
        path: Gen/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30